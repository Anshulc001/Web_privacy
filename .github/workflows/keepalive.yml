name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days of
# inactivity. Committing a timestamp once a month keeps the daily data update
# workflow enabled. See the README section "Keeping the data pipeline alive".

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
      - name: Commit timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: keep scheduled workflows enabled"
          git push
